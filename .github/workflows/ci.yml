name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - prasad-branch

  pull_request:
    branches:
      - main
      - master
      - prasad-branch

jobs:

  backend-ci:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Project Imports
        run: |
          python -c "import main"

      - name: Verify Application Startup
        run: |
          python -m py_compile main.py

      - name: CI Completed
        run: echo "Backend verification completed successfully."
        
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: secure-firmware-update-system:latest

      - name: Docker Build Completed
        run: echo "Docker image built successfully."        